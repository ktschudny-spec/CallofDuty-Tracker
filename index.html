

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call of Duty Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #171313;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 92%;
    min-height: 88vh;
    margin: 6vh auto;
    border: 3px solid #ff8c00;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 450px;
    padding: 55px 45px;
    border: 3px solid #ff8c00;
    background: rgba(35, 25, 25, 0.85);
    text-align: center;
}

.login-box h1 {
    margin: 0 0 12px;
    color: #ff8c00;
    font-size: 30px;
}

.login-box h2 {
    margin: 0 0 28px;
    font-size: 16px;
}

.login-box input {
    width: 100%;
    height: 48px;
    padding: 12px;
    margin-bottom: 10px;
    background: #392727;
    border: 2px solid #ff8c00;
    color: white;
    font-size: 15px;
}

.login-box input::placeholder {
    color: white;
    opacity: 1;
}

.login-box button {
    width: 100%;
    height: 48px;
    border: none;
    background: #ff9800;
    color: #111;
    font-size: 14px;
    cursor: pointer;
}

.login-box button:hover {
    background: #ffad32;
}

.hidden {
    display: none !important;
}

.stats-container {
    width: 92%;
    min-height: 88vh;
    margin: 6vh auto;
    border: 3px solid #ff8c00;
    padding: 35px;
}

.stats-title {
    text-align: center;
    color: #ff8c00;
    font-size: 32px;
    margin: 0 0 8px;
}

.player-name {
    text-align: center;
    font-size: 18px;
    margin-bottom: 25px;
}

.top-buttons {
    text-align: center;
    margin-bottom: 25px;
}

.top-buttons button {
    padding: 12px 22px;
    margin: 5px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.generate {
    background: #ff9800;
    color: #111;
}

.logout {
    background: #333;
    color: white;
}

.main-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-box {
    border: 2px solid #ff8c00;
    background: #241a1a;
    text-align: center;
    padding: 25px;
}

.stat-box h3 {
    color: #ff8c00;
    margin-top: 0;
}

.stat-number {
    font-size: 35px;
    font-weight: bold;
}

.scorestreak-section {
    border: 2px solid #ff8c00;
    background: #241a1a;
    padding: 25px;
    margin-bottom: 25px;
}

.scorestreak-section h2 {
    color: #ff8c00;
    text-align: center;
    margin-top: 0;
}

.scorestreaks {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.scorestreak {
    padding: 15px 8px;
    background: #352626;
    border: 1px solid #555;
    text-align: center;
}

.maps-section {
    border: 2px solid #ff8c00;
    background: #241a1a;
    padding: 25px;
}

.maps-section h2 {
    color: #ff8c00;
    text-align: center;
}

.maps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.map-card {
    background: #352626;
    border: 1px solid #555;
    padding-bottom: 15px;
    text-align: center;
}

.map-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.map-card h3 {
    color: #ff8c00;
    margin-bottom: 5px;
}

.map-card p {
    margin: 0;
}

@media (max-width: 800px) {
    .main-stats {
        grid-template-columns: 1fr;
    }

    .scorestreaks {
        grid-template-columns: repeat(2, 1fr);
    }

    .maps {
        grid-template-columns: 1fr;
    }

    .stats-container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div id="loginPage" class="page">

    <div class="login-box">

        <h1>Call of Duty Tracker</h1>

        <h2>Sign Up / Login</h2>

        <input
            id="username"
            type="text"
            placeholder="Enter Call of Duty username"
            aria-label="Enter Call of Duty username"
        >

        <button
            type="button"
            onclick="viewStats()"
        >
            VIEW MY STATS
        </button>

    </div>

</div>

<div id="statsPage" class="stats-container hidden">

    <h1 class="stats-title">Call of Duty Tracker</h1>

    <div id="playerName" class="player-name"></div>

    <div class="top-buttons">

        <button
            class="generate"
            type="button"
            onclick="generateStats()"
        >
            GENERATE NEW STATS
        </button>

        <button
            class="logout"
            type="button"
            onclick="logout()"
        >
            LOG OUT
        </button>

    </div>

    <div class="main-stats">

        <div class="stat-box">
            <h3>Kills</h3>
            <div id="kills" class="stat-number">0</div>
        </div>

        <div class="stat-box">
            <h3>Deaths</h3>
            <div id="deaths" class="stat-number">0</div>
        </div>

        <div class="stat-box">
            <h3>Highest Streak</h3>
            <div id="streak" class="stat-number">0</div>
        </div>

    </div>

    <div class="scorestreak-section">

        <h2>Most Used Scorestreaks</h2>

        <div id="mostUsed" class="scorestreaks"></div>

    </div>

    <div class="scorestreak-section">

        <h2>Least Used Scorestreaks</h2>

        <div id="leastUsed" class="scorestreaks"></div>

    </div>

    <div class="maps-section">

        <h2>Maps</h2>

        <div class="maps">

            <div class="map-card">

                <img
                    id="mostPlayedImage"
                    src="images/rust.jpg"
                    alt="Most played Call of Duty map"
                >

                <h3>Most Played Map</h3>

                <p id="mostPlayed">Rust</p>

            </div>

            <div class="map-card">

                <img
                    id="leastPlayedImage"
                    src="images/piccadilly.jpg"
                    alt="Least played Call of Duty map"
                >

                <h3>Least Played Map</h3>

                <p id="leastPlayed">Piccadilly</p>

            </div>

        </div>

    </div>

</div>

<script>
const scorestreaks = [
    "UAV",
    "Hunter Killer",
    "K9 Unit",
    "Counter UAV",
    "VTOL Warship",
    "HKDs",
    "Rhino",
    "D.A.W.G",
    "Watchdog Helo",
    "Gravemaker",
    "Care Package",
    "SAM Turret",
    "Guardian",
    "Sentry Gun",
    "Hellstorm Missile",
    "Lightning Strike",
    "Drone Squad",
    "Chopper Gunner",
    "Gunship",
    "Attack Chopper",
    "Cluster Strike",
    "Cruise Missile",
    "Advanced UAV",
    "Juggernaut",
    "Wheelson",
    "Trophy System",
    "Counter Spy Plane",
    "Napalm Strike",
    "Death Machine",
    "RC-XD"
];

const maps = [
    ["Rust", "images/rust.jpg"],
    ["Nuketown", "images/nuketown.jpg"],
    ["Shipment", "images/shipment.jpg"],
    ["Terminal", "images/terminal.jpg"],
    ["Raid", "images/raid.jpg"],
    ["Highrise", "images/highrise.jpg"],
    ["Firing Range", "images/firing-range.jpg"],
    ["Crash", "images/crash.jpg"],
    ["Shoot House", "images/shoot-house.jpg"],
    ["Standoff", "images/standoff.jpg"],
    ["Piccadilly", "images/piccadilly.jpg"],
    ["Vacant", "images/vacant.jpg"]
];

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }

    return newArray;
}

function viewStats() {

    const username = document
        .getElementById("username")
        .value
        .trim();

    if (username === "") {
        alert("Please enter a Call of Duty username.");
        return;
    }

    document.getElementById("playerName").textContent =
        "Player: " + username;

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");

    document
        .getElementById("statsPage")
        .classList
        .remove("hidden");

    generateStats();
}

function generateStats() {

    document.getElementById("kills").textContent =
        randomNumber(1000, 25000).toLocaleString();

    document.getElementById("deaths").textContent =
        randomNumber(500, 15000).toLocaleString();

    document.getElementById("streak").textContent =
        randomNumber(5, 50);

    const randomScorestreaks = shuffle(scorestreaks);

    const mostUsed = randomScorestreaks.slice(0, 5);

    const leastUsed = randomScorestreaks.slice(5, 10);

    document.getElementById("mostUsed").innerHTML =
        mostUsed
            .map(function(item) {
                return '<div class="scorestreak">' + item + '</div>';
            })
            .join("");

    document.getElementById("leastUsed").innerHTML =
        leastUsed
            .map(function(item) {
                return '<div class="scorestreak">' + item + '</div>';
            })
            .join("");

    const randomMaps = shuffle(maps);

    const mostPlayed = randomMaps[0];

    const leastPlayed = randomMaps[1];

    document.getElementById("mostPlayed").textContent =
        mostPlayed[0];

    document.getElementById("mostPlayedImage").src =
        mostPlayed[1];

    document.getElementById("mostPlayedImage").alt =
        "Image of " + mostPlayed[0];

    document.getElementById("leastPlayed").textContent =
        leastPlayed[0];

    document.getElementById("leastPlayedImage").src =
        leastPlayed[1];

    document.getElementById("leastPlayedImage").alt =
        "Image of " + leastPlayed[0];
}

function logout() {

    document
        .getElementById("statsPage")
        .classList
        .add("hidden");

    document
        .getElementById("loginPage")
        .classList
        .remove("hidden");

    document.getElementById("username").value = "";
}
</script>

</body>
</html>
