

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call of Duty Tracker</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #171313;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.5;
}

button,
input {
    font: inherit;
}

button:focus,
input:focus {
    outline: 3px solid #66b3ff;
    outline-offset: 3px;
}

.skip-link {
    position: absolute;
    left: -9999px;
    top: 10px;
    background: white;
    color: black;
    padding: 10px 15px;
    z-index: 1000;
}

.skip-link:focus {
    left: 10px;
}

.page {
    width: 92%;
    min-height: 88vh;
    margin: 6vh auto;
    border: 3px solid #ff8c00;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 450px;
    padding: 55px 45px;
    border: 3px solid #ff8c00;
    background: rgba(35, 25, 25, 0.88);
    text-align: center;
}

.login-box h1 {
    margin: 0 0 10px;
    color: #ff8c00;
    font-size: 30px;
}

.login-box h2 {
    margin: 0 0 28px;
    font-size: 16px;
}

.login-box label {
    display: block;
    text-align: left;
    margin-bottom: 6px;
    font-weight: bold;
}

.login-box input {
    width: 100%;
    height: 48px;
    padding: 12px;
    margin-bottom: 12px;
    background: #392727;
    border: 2px solid #ff8c00;
    color: white;
}

.login-box input::placeholder {
    color: white;
    opacity: 1;
}

.login-box button {
    width: 100%;
    height: 48px;
    border: none;
    background: #ff9800;
    color: #111;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.login-box button:hover {
    background: #ffad32;
}

.error-message {
    color: #ffb3b3;
    margin: 0 0 12px;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

.stats-container {
    width: 92%;
    min-height: 88vh;
    margin: 6vh auto;
    border: 3px solid #ff8c00;
    padding: 35px;
}

.stats-title {
    text-align: center;
    color: #ff8c00;
    font-size: 32px;
    margin: 0 0 8px;
}

.player-name {
    text-align: center;
    font-size: 18px;
    margin-bottom: 25px;
}

.top-buttons {
    text-align: center;
    margin-bottom: 25px;
}

.top-buttons button {
    padding: 12px 22px;
    margin: 5px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.generate {
    background: #ff9800;
    color: #111;
}

.logout {
    background: #333;
    color: white;
}

.main-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-box {
    border: 2px solid #ff8c00;
    background: #241a1a;
    text-align: center;
    padding: 25px;
}

.stat-box h2 {
    color: #ff8c00;
    margin-top: 0;
}

.stat-number {
    font-size: 35px;
    font-weight: bold;
}

.scorestreak-section {
    border: 2px solid #ff8c00;
    background: #241a1a;
    padding: 25px;
    margin-bottom: 25px;
}

.scorestreak-section h2 {
    color: #ff8c00;
    text-align: center;
    margin-top: 0;
}

.scorestreaks {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.scorestreak {
    padding: 15px 8px;
    background: #352626;
    border: 1px solid #555;
    text-align: center;
}

.maps-section {
    border: 2px solid #ff8c00;
    background: #241a1a;
    padding: 25px;
}

.maps-section h2 {
    color: #ff8c00;
    text-align: center;
}

.maps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.map-card {
    background: #352626;
    border: 1px solid #555;
    padding-bottom: 15px;
    text-align: center;
}

.map-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.map-card h3 {
    color: #ff8c00;
    margin-bottom: 5px;
}

.map-card p {
    margin: 0;
}

.image-error {
    min-height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #241a1a;
    color: #aaa;
    padding: 20px;
}

@media (max-width: 800px) {
    .main-stats {
        grid-template-columns: 1fr;
    }

    .scorestreaks {
        grid-template-columns: repeat(2, 1fr);
    }

    .maps {
        grid-template-columns: 1fr;
    }

    .stats-container {
        padding: 20px;
    }
}

@media (max-width: 500px) {
    .page {
        width: 94%;
    }

    .login-box {
        width: 90%;
        padding: 40px 25px;
    }

    .scorestreaks {
        grid-template-columns: 1fr;
    }
}

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
}
</style>
</head>

<body>

<a class="skip-link" href="#main-content">
    Skip to main content
</a>

<main id="main-content">

<section id="loginPage" class="page" aria-labelledby="loginTitle">

    <div class="login-box">

        <h1 id="loginTitle">
            Call of Duty Tracker
        </h1>

        <h2>
            Sign Up / Login
        </h2>

        <label for="username">
            Call of Duty Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Enter Call of Duty username"
            maxlength="30"
            autocomplete="username"
        >

        <p
            id="loginError"
            class="error-message"
            role="alert"
            aria-live="assertive"
        ></p>

        <button
            id="loginButton"
            class="login-button"
            type="button"
            onclick="viewStats()"
        >
            VIEW MY STATS
        </button>

        <p class="demo">
            Demo website - Stats are randomly generated.
        </p>

    </div>

</section>

<section
    id="statsPage"
    class="page hidden"
    aria-labelledby="statsTitle"
>

    <div class="stats-container">

        <h1
            id="statsTitle"
            class="stats-title"
        >
            Call of Duty Tracker
        </h1>

        <div
            id="playerName"
            class="player-name"
            aria-live="polite"
        ></div>

        <div
            class="top-buttons"
            aria-label="Statistics controls"
        >

            <button
                id="generateButton"
                class="generate"
                type="button"
                onclick="generateStats()"
            >
                GENERATE NEW STATS
            </button>

            <button
                id="logoutButton"
                class="logout"
                type="button"
                onclick="logout()"
            >
                LOG OUT
            </button>

        </div>

        <div
            id="statsAnnouncement"
            class="hidden"
            aria-live="polite"
        ></div>

        <section
            class="main-stats"
            aria-label="Player statistics"
        >

            <div class="stat-box">
                <h2>Kills</h2>
                <div
                    id="kills"
                    class="stat-number"
                    aria-label="Number of kills"
                >
                    0
                </div>
            </div>

            <div class="stat-box">
                <h2>Deaths</h2>
                <div
                    id="deaths"
                    class="stat-number"
                    aria-label="Number of deaths"
                >
                    0
                </div>
            </div>

            <div class="stat-box">
                <h2>Highest Streak</h2>
                <div
                    id="streak"
                    class="stat-number"
                    aria-label="Highest kill streak"
                >
                    0
                </div>
            </div>

        </section>

        <section
            class="scorestreak-section"
            aria-labelledby="mostUsedTitle"
        >

            <h2 id="mostUsedTitle">
                Most Used Scorestreaks
            </h2>

            <div
                id="mostUsed"
                class="scorestreaks"
                role="list"
                aria-label="Most used scorestreaks"
            ></div>

        </section>

        <section
            class="scorestreak-section"
            aria-labelledby="leastUsedTitle"
        >

            <h2 id="leastUsedTitle">
                Least Used Scorestreaks
            </h2>

            <div
                id="leastUsed"
                class="scorestreaks"
                role="list"
                aria-label="Least used scorestreaks"
            ></div>

        </section>

        <section
            class="maps-section"
            aria-labelledby="mapsTitle"
        >

            <h2 id="mapsTitle">
                Maps
            </h2>

            <div class="maps">

                <article class="map-card">

                    <img
                        id="mostPlayedImage"
                        src="images/rust.jpeg"
                        alt="Rust Call of Duty map"
                    >

                    <h3>
                        Most Played Map
                    </h3>

                    <p id="mostPlayed">
                        Rust
                    </p>

                </article>

                <article class="map-card">

                    <img
                        id="leastPlayedImage"
                        src="images/piccadilly.jpeg"
                        alt="Piccadilly Call of Duty map"
                    >

                    <h3>
                        Least Played Map
                    </h3>

                    <p id="leastPlayed">
                        Piccadilly
                    </p>

                </article>

            </div>

        </section>

    </div>

</section>

</main>

<script>
const scorestreaks = [
    "UAV",
    "Hunter Killer",
    "K9 Unit",
    "Counter UAV",
    "VTOL Warship",
    "HKDs",
    "Rhino",
    "D.A.W.G",
    "Watchdog Helo",
    "Gravemaker",
    "Care Package",
    "SAM Turret",
    "Guardian",
    "Sentry Gun",
    "Hellstorm Missile",
    "Lightning Strike",
    "Drone Squad",
    "Chopper Gunner",
    "Gunship",
    "Attack Chopper",
    "Cluster Strike",
    "Cruise Missile",
    "Advanced UAV",
    "Juggernaut",
    "Wheelson",
    "Trophy System",
    "Counter Spy Plane",
    "Napalm Strike",
    "Death Machine",
    "RC-XD"
];

const maps = [
    {
        name: "Rust",
        image: "images/rust.jpeg"
    },
    {
        name: "Nuketown",
        image: "images/nuketown.jpeg"
    },
    {
        name: "Shipment",
        image: "images/shipment.jpeg"
    },
    {
        name: "Terminal",
        image: "images/terminal.jpeg"
    },
    {
        name: "Raid",
        image: "images/raid.jpeg"
    },
    {
        name: "Highrise",
        image: "images/highrise.jpeg"
    },
    {
        name: "Firing Range",
        image: "images/firing-range.jpeg"
    },
    {
        name: "Crash",
        image: "https://github.com/ktschudny-spec/CallofDuty-Tracker/blob/main/crash.jpg?raw=true"
    },
    {
        name: "Shoot House",
        image: "images/shoothouse.jpeg"
    },
    {
        name: "Standoff",
        image: "images/standoff.jpeg"
    },
    {
        name: "Piccadilly",
        image: "images/piccadilly.jpeg"
    },
    {
        name: "Vacant",
        image: "images/vacant.jpeg"
    }
];

function randomNumber(min, max) {
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}

function shuffle(array) {
    const newArray = [...array];

    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {
        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            newArray[i],
            newArray[j]
        ] = [
            newArray[j],
            newArray[i]
        ];
    }

    return newArray;
}

function viewStats() {

    const usernameInput =
        document.getElementById("username");

    const username =
        usernameInput.value.trim();

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if (username === "") {

        error.textContent =
            "Please enter a Call of Duty username.";

        usernameInput.focus();

        return;
    }

    document.getElementById(
        "playerName"
    ).textContent =
        "Player: " + username;

    document.getElementById(
        "loginPage"
    ).classList.add("hidden");

    document.getElementById(
        "statsPage"
    ).classList.remove("hidden");

    generateStats();

    document.getElementById(
        "generateButton"
    ).focus();
}

function generateStats() {

    const kills =
        randomNumber(1000, 25000);

    const deaths =
        randomNumber(500, 15000);

    const streak =
        randomNumber(5, 50);

    document.getElementById(
        "kills"
    ).textContent =
        kills.toLocaleString();

    document.getElementById(
        "deaths"
    ).textContent =
        deaths.toLocaleString();

    document.getElementById(
        "streak"
    ).textContent =
        streak;

    const randomScorestreaks =
        shuffle(scorestreaks);

    const mostUsed =
        randomScorestreaks.slice(0, 5);

    const leastUsed =
        randomScorestreaks.slice(5, 10);

    document.getElementById(
        "mostUsed"
    ).innerHTML =
        mostUsed.map(function(item) {

            return `
                <div
                    class="scorestreak"
                    role="listitem"
                >
                    ${item}
                </div>
            `;

        }).join("");

    document.getElementById(
        "leastUsed"
    ).innerHTML =
        leastUsed.map(function(item) {

            return `
                <div
                    class="scorestreak"
                    role="listitem"
                >
                    ${item}
                </div>
            `;

        }).join("");

    const randomMaps =
        shuffle(maps);

    const mostPlayed =
        randomMaps[0];

    const leastPlayed =
        randomMaps[1];

    document.getElementById(
        "mostPlayed"
    ).textContent =
        mostPlayed.name;

    document.getElementById(
        "leastPlayed"
    ).textContent =
        leastPlayed.name;

    setMapImage(
        "mostPlayedImage",
        mostPlayed
    );

    setMapImage(
        "leastPlayedImage",
        leastPlayed
    );

    document.getElementById(
        "statsAnnouncement"
    ).textContent =
        "New statistics have been generated.";
}

function setMapImage(
    imageId,
    map
) {

    const image =
        document.getElementById(imageId);

    image.src = map.image;

    image.alt =
        "Image of " +
        map.name +
        " Call of Duty map";

    image.onerror = function() {

        image.onerror = null;

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "image-error";

        errorBox.setAttribute(
            "role",
            "img"
        );

        errorBox.setAttribute(
            "aria-label",
            map.name +
            " map image unavailable"
        );

        errorBox.textContent =
            map.name +
            " image unavailable";

        image.replaceWith(errorBox);
    };
}

function logout() {

    document.getElementById(
        "statsPage"
    ).classList.add("hidden");

    document.getElementById(
        "loginPage"
    ).classList.remove("hidden");

    document.getElementById(
        "username"
    ).value = "";

    document.getElementById(
        "loginError"
    ).textContent = "";

    document.getElementById(
        "username"
    ).focus();
}

document.getElementById(
    "username"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            viewStats();
        }
    }
);

document.addEventListener(
    "keydown",
    function(event) {

        const statsPage =
            document.getElementById(
                "statsPage"
            );

        if (
            statsPage.classList.contains(
                "hidden"
            )
        ) {
            return;
        }

        const generateButton =
            document.getElementById(
                "generateButton"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const current =
            document.activeElement;

        if (
            current !== generateButton &&
            current !== logoutButton
        ) {
            return;
        }

        if (
            event.key === "ArrowRight" ||
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            logoutButton.focus();
        }

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            generateButton.focus();
        }

        if (event.key === "Enter") {

            event.preventDefault();

            current.click();
        }
    }
);
</script>

</body>
</html>
